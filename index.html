<style>
:root{--bg:#050b1c;--fg:#fff;--ac:#ffd23f;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050b1c}}
:root[data-theme="dark"]{--bg:#050b1c}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:'Poppins',system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#13407a 0%,#0a1d45 45%,#050b1c 85%) center/cover}
#app::before{content:'';position:absolute;inset:-60%;background:repeating-conic-gradient(from 0deg at 50% 45%,rgba(90,210,255,.11) 0 5deg,transparent 5deg 22deg);-webkit-mask:radial-gradient(circle at 50% 45%,#000,transparent 55%);mask:radial-gradient(circle at 50% 45%,#000,transparent 55%);animation:spin 70s linear infinite;pointer-events:none}
#app::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.6));pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
#bok{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.fb{position:absolute;bottom:-60px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7a8,#ffd21f 60%,#c98a00);animation:fl linear infinite;opacity:.35;filter:blur(1px)}
@keyframes fl{to{transform:translateY(-125vh)}}
button,input{font:inherit;color:#fff}
.b{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);border-radius:14px;padding:9px 12px;cursor:pointer;backdrop-filter:blur(6px);font-weight:700;font-size:13px}
.b:active{transform:scale(.95)}.b.off{opacity:.5;text-decoration:line-through}
input[type=text],input[type=number]{background:rgba(0,0,20,.5);border:1px solid rgba(255,255,255,.28);border-radius:10px;padding:9px 10px;width:100%;font-weight:500}
input[type=text]:focus,input[type=number]:focus{outline:0;border-color:#5ad7ff;box-shadow:0 0 10px #5ad7ff88}
#hud{position:absolute;inset:0;display:none;flex-direction:column;padding:calc(8px + env(safe-area-inset-top,0px)) 10px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}#hud.on{display:flex}
#top{display:flex;gap:8px;align-items:center}
#chan{flex:1;min-width:0;position:relative;overflow:hidden;padding:9px 14px;border-radius:16px;background:linear-gradient(135deg,rgba(10,20,50,.85),rgba(30,10,60,.85));border:2px solid transparent;background-clip:padding-box;font-weight:800;font-size:clamp(15px,4.6vw,22px);letter-spacing:.5px;white-space:nowrap;text-overflow:ellipsis;animation:neon 4s linear infinite}
#chan span{background:linear-gradient(90deg,#ffe45c,#ff6ab0,#6ac3ff,#7dff6a,#ffe45c);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shift 4s linear infinite;filter:drop-shadow(0 0 7px rgba(255,200,80,.7))}
#chan::after{content:'';position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);animation:sweep 3.2s ease-in-out infinite}
@keyframes shift{to{background-position:300% 0}}
@keyframes sweep{60%,100%{left:130%}}
@keyframes neon{0%,100%{box-shadow:0 0 0 2px #ff6ab0,0 0 18px #ff6ab0aa}33%{box-shadow:0 0 0 2px #ffd23f,0 0 18px #ffd23faa}66%{box-shadow:0 0 0 2px #5ad7ff,0 0 18px #5ad7ffaa}}
#ico{display:flex;gap:6px}#ico .b{width:40px;height:40px;padding:0;font-size:18px;border-radius:50%}
#lb{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.lbi{background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(0,0,0,.45));border:1px solid var(--c);border-top:4px solid var(--c);border-radius:12px;padding:4px 6px;text-align:center;min-width:0;box-shadow:0 0 8px color-mix(in srgb,var(--c) 45%,transparent);transition:.25s}
.lbi b{display:block;font-size:11px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.lbi em{font-style:normal;font-weight:800;font-size:20px;line-height:1.1}
.lbi.top{transform:translateY(-2px) scale(1.04);background:linear-gradient(180deg,rgba(255,210,63,.45),rgba(60,40,0,.55));box-shadow:0 0 18px #ffd23f}
#ttl{text-align:center;margin-top:8px}
#ttl h2{margin:0;font-size:clamp(15px,4.8vw,23px);font-weight:800;letter-spacing:1px;background:linear-gradient(90deg,#7dff6a,#ffe45c,#ff6ab0,#6ac3ff,#7dff6a);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shift 5s linear infinite;filter:drop-shadow(0 0 8px rgba(255,230,90,.55))}
#left{display:inline-block;margin-top:4px;background:rgba(0,0,0,.5);border:1px solid rgba(255,210,63,.6);border-radius:20px;padding:2px 14px;font-weight:700;font-size:13px;color:#ffe45c}
#stage{flex:1;min-height:0;position:relative;margin-top:4px}#cv{position:absolute;inset:0;width:100%;height:100%}
#bar{display:flex;gap:10px;justify-content:center;padding-top:4px}#bar .b{min-width:120px;font-size:14px;padding:10px 16px}
.foot{display:flex;justify-content:center;gap:4px 14px;flex-wrap:wrap;font-weight:700;font-size:10px;letter-spacing:.6px;text-shadow:0 1px 4px #000;text-align:center;padding:6px 6px 0;opacity:.9}
#home{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;z-index:20;-webkit-overflow-scrolling:touch;display:flex}
.wrap{margin:0 auto;width:min(94vw,460px);padding:calc(14px + env(safe-area-inset-top,0px)) 0 20px;text-align:center}
#pvw{position:relative;width:min(80vw,340px);margin:0 auto;aspect-ratio:1000/1150}#pv{width:100%;height:100%;display:block}
h1{margin:6px 0 0;font-size:42px;font-weight:800;letter-spacing:3px;background:linear-gradient(90deg,#7dff6a,#ffe45c,#ff6ab0,#6ac3ff,#7dff6a);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shift 5s linear infinite;filter:drop-shadow(0 0 14px rgba(255,220,90,.55))}
.sub{margin:2px 0 14px;opacity:.9;font-size:13px;letter-spacing:1px;color:#bfe6ff}
.big{font-family:inherit;font-size:26px;font-weight:800;border:0;border-radius:20px;padding:12px 52px;color:#143;background:linear-gradient(#ffe45c,#ffb300);box-shadow:0 6px 0 #b97a00,0 12px 30px rgba(255,190,0,.45);cursor:pointer;margin-bottom:18px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}.big:active{transform:translateY(4px);box-shadow:0 2px 0 #b97a00}
.card{background:rgba(255,255,255,.08);border:1px solid rgba(120,200,255,.3);border-radius:18px;padding:14px;text-align:left;display:grid;gap:10px;box-shadow:0 0 22px rgba(60,150,255,.2)}
.card label{display:grid;gap:4px;font-size:13px;font-weight:500}.g4{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row{display:flex;gap:8px}.row>*{flex:1}
input[type=range]{width:100%;accent-color:#ffd23f}
#res{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:10;background:rgba(0,0,10,.55);backdrop-filter:blur(3px)}#res.on{display:flex}
.rc{width:min(90vw,380px);text-align:center;background:linear-gradient(160deg,rgba(20,30,80,.92),rgba(40,10,70,.92));border:2px solid #ffd23f;border-radius:24px;padding:18px 16px;box-shadow:0 0 40px #ffd23f88,inset 0 0 30px rgba(255,255,255,.06);animation:in .5s both}
.trophy{font-size:56px;animation:bob 1s infinite}@keyframes bob{50%{transform:translateY(-8px) rotate(6deg)}}
.wl{font-size:13px;letter-spacing:4px;color:#ffe45c;font-weight:700}
.wt{font-size:34px;font-weight:800;color:var(--c);text-shadow:0 0 18px var(--c),0 2px 6px #000;margin:2px 0 8px;overflow-wrap:anywhere}
.wb{display:inline-block;background:rgba(0,0,0,.5);border:2px solid var(--c);border-radius:16px;padding:6px 22px;box-shadow:0 0 16px var(--c)}.wb b{font-size:34px;color:#ffe45c;margin-right:6px}.wb span{font-weight:700;letter-spacing:2px}
.rw{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.45);border-left:6px solid var(--c);border-radius:10px;padding:5px 10px;margin:5px 0;font-weight:700;font-size:14px;animation:in .5s both}.rw b{flex:1;text-align:left}.rw span{opacity:.7}
@keyframes in{from{opacity:0;transform:translateY(30px) scale(.85)}}
.nx{margin-top:10px;font-size:12px;opacity:.9}.pg{height:5px;border-radius:5px;background:rgba(255,255,255,.2);margin-top:5px;overflow:hidden}.pg i{display:block;height:100%;background:linear-gradient(90deg,#7dff6a,#ffd23f);animation:pgr 7s linear forwards}@keyframes pgr{from{width:0}to{width:100%}}
#cd{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:9;pointer-events:none;font-size:clamp(90px,34vw,190px);font-weight:800;color:#ffe45c;text-shadow:0 0 30px #ff9d00,0 0 70px #ff4d8d,0 6px 0 #a04800}
#cd.on{display:flex}#cd b{animation:cdp .9s ease-out both}@keyframes cdp{0%{transform:scale(2.4);opacity:0}25%{opacity:1}100%{transform:scale(.9);opacity:.85}}
#toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:#000c;border-radius:12px;padding:10px 14px;z-index:40;display:none;max-width:86vw;text-align:center;font-size:13px}

.c2 .yt{background:#fff}.c2 .yt::after{border-left-color:#e00}
#hist{flex:none;align-self:stretch;height:clamp(96px,14vh,124px);margin-top:4px;padding:6px 8px;border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(0,0,20,.55));border:1px solid rgba(255,255,255,.22);display:flex;flex-direction:column;gap:5px;overflow:hidden;box-shadow:0 0 14px rgba(60,150,255,.25)}
#hs{flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.hc{display:flex;align-items:center;gap:4px;min-width:0;padding:3px 6px;border-radius:9px;background:rgba(0,0,0,.35);border:1px solid var(--c)}
.hc b{flex:1;min-width:0;font-size:10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.hc em{display:inline-block;font-style:normal;font-weight:800;font-size:15px;color:#ffe45c}
.hd{flex:none;width:11px;height:11px;border-radius:50%}
#hd{flex:1;min-height:0;display:flex;flex-wrap:wrap;align-content:flex-start;gap:5px;overflow-y:auto;scrollbar-width:none}
#hd::-webkit-scrollbar{display:none}
#hd:empty::before{content:'Round winners will appear here';font-size:11px;opacity:.55;margin:auto}
.dt{flex:none;width:17px;height:17px;border-radius:50%;box-shadow:inset 0 -2px 3px rgba(0,0,0,.3),0 0 6px rgba(255,255,255,.35);animation:dti .5s cubic-bezier(.3,1.8,.5,1) both}
.dt.new{animation:dti .5s cubic-bezier(.3,1.8,.5,1) both,dtp 1s ease-in-out .5s infinite}
@keyframes dti{from{transform:scale(0);opacity:0}}
@keyframes dtp{50%{transform:scale(1.25);box-shadow:0 0 12px #fff}}
.bump{animation:bmp .5s ease-out}@keyframes bmp{40%{transform:scale(1.6)}}

.lg{display:block;margin:0 auto;width:96px;height:96px;filter:drop-shadow(0 0 12px rgba(255,210,63,.5))}
#auth{position:absolute;inset:0;z-index:200;display:flex;overflow-y:auto;background:radial-gradient(ellipse at 50% 30%,#13407a,#0a1d45 50%,#050b1c 90%);padding:calc(16px + env(safe-area-inset-top,0px)) 16px 24px}
#auth .bx{width:min(92vw,380px);text-align:center;margin:auto}
#auth .lg{width:150px;height:150px}
#auth h3{margin:8px 0 2px;font-size:19px;font-weight:800;letter-spacing:1px;color:#ffe45c}
#auth p{margin:0 0 6px;font-size:12px;opacity:.8}
#auth label{display:block;text-align:left;font-size:12px;font-weight:700;margin-top:10px}
#auth input:not([type=checkbox]){background:rgba(0,0,20,.5);border:1px solid rgba(255,255,255,.28);border-radius:10px;padding:11px 12px;width:100%;font-weight:500;font-size:15px;margin-top:4px}

#aMsg{min-height:18px;margin:8px 0 2px;font-size:13px;font-weight:700;color:#ff8a8a}
#auth .big{width:100%;margin-top:4px}#aCancel{margin-top:10px;width:100%}
